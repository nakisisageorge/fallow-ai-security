[package]
name = "fallow-compliance"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nakisisageorge/fallow-ai-security"
description = "Compliance report generator for fallow security findings (OWASP, CWE, SOC2, ISO 27001)"

[dependencies]
fallow-types = { path = "../types" }
fallow-output = { path = "../output" }
fallow-security = { path = "../security" }
fallow-api = { path = "../api" }
fallow-config = { path = "../config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tabled = { version = "0.22", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }